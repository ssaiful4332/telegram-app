<!-- অ্যাড কাউন্টার ও প্রোগ্রেস দেখানোর জন্য ছোট্ট একটি সেকশন -->
<div id="ad-lock-section" style="background: #161b22; padding: 15px; border-radius: 10px; text-align: center; border: 1px solid #30363d; margin-bottom: 15px;">
    <h3 style="color: #58a6ff; margin-top: 0;">🔒 ভিডিওটি লক করা আছে</h3>
    <p id="ad-status" style="color: #8b949e; font-size: 14px;">ভিডিও আনলক করতে নিচের বাটনে ক্লিক করে ৩টি অ্যাড দেখুন: <b style="color: #e3b341;">0/3</b></p>
    <button id="watch-ad-btn" onclick="watchAd()" style="background: #1f6feb; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%;">📺 অ্যাড দেখুন (১/৩)</button>
</div>

<script>
    let adsWatched = 0;
    const totalAdsRequired = 3;
    const targetVideoUrl = "https://t.me/SSFileStorebot?start=5170965"; // আসল ভিডিওর লিংক

    function watchAd() {
        // এখানে আপনার অ্যাড নেটওয়ার্কের অ্যাড কোড বা পপ-আপ ওপেন হওয়ার ফাংশন দিতে হবে
        // যেমন: Adsterra বা অন্য কোনো মোটিভাইড অ্যাড লিংক নতুন ট্যাবে ওপেন হতে পারে
        window.open("https://your-ad-link.com", "_blank"); // অ্যাড লিংক 

        adsWatched++;

        if (adsWatched < totalAdsRequired) {
            document.getElementById('ad-status').innerHTML = `ভিডিও আনলক করতে আরও বাকি আছে: <b style="color: #e3b341;">${adsWatched}/${totalAdsRequired}</b>`;
            document.getElementById('watch-ad-btn').innerText = `📺 পরবর্তী অ্যাড দেখুন (${adsWatched + 1}/৩)`;
        } else {
            // ৩টি অ্যাড দেখা শেষ হলে লক হটিয়ে ভিডিও লিংক দিয়ে দেওয়া হবে
            document.getElementById('ad-lock-section').innerHTML = `
                <h3 style="color: #2ea043; margin-top: 0;">✅ আনলক সফল হয়েছে!</h3>
                <p style="color: #8b949e; font-size: 14px;">আপনার ভিডিওটি নিচে দেখতে পান:</p>
                <a href="${targetVideoUrl}" target="_blank" style="display: block; background: #238636; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold;">🔓 ভিডিও ওপেন করুন</a>
            `;
        }
    }
</script>
