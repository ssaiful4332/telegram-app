<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESI HUB - Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #ffffff;
            --accent-color: #0088cc;
            --btn-color: #1f6feb;
        }
        body {
            font-family: Arial, sans-serif, 'SolaimanLipi';
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .header h2 {
            margin: 0;
            font-size: 20px;
            letter-spacing: 1px;
            color: #58a6ff;
        }
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            white-space: nowrap;
        }
        .categories::-webkit-scrollbar {
            display: none;
        }
        .cat-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid #30363d;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }
        .cat-btn.active, .cat-btn:hover {
            background: var(--btn-color);
            border-color: var(--btn-color);
        }
        .section-title {
            font-size: 18px;
            color: #58a6ff;
            margin: 15px 0 10px 5px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid #30363d;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            cursor: pointer;
        }
        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            position: relative;
        }
        .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #ff4444;
            color: white;
            padding: 3px 8px;
            font-size: 12px;
            border-radius: 4px;
            font-weight: bold;
        }
        .card-body {
            padding: 12px;
        }
        .card-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .card-desc {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 12px;
        }
        .unlock-btn {
            width: 100%;
            background: linear-gradient(135deg, #238636, #2ea043);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .unlock-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>『DESI HUB』</h2>
        <span id="user-name">User</span>
    </div>

    <div class="categories">
        <button class="cat-btn active">All Posts</button>
        <button class="cat-btn">বাংলা নাটক + সিনেমা 🎬</button>
        <button class="cat-btn">ব্যাচেলর পয়েন্ট</button>
        <button class="cat-btn">Leaked</button>
        <button class="cat-btn">CP</button>
        <button class="cat-btn">Mom Son</button>
        <button class="cat-btn">Anime</button>
    </div>

    <div class="section-title">Latest All Videos</div>

    <!-- ভিডিও কার্ড ১ (আপনার নতুন বট লিংক যুক্ত করা হয়েছে) -->
    <div class="card" onclick="openTelegramLink('https://t.me/SSFileStorebot?start=5170965')">
        <div style="position: relative;">
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe" class="card-img" alt="Thumbnail">
            <div class="badge">New</div>
        </div>
        <div class="card-body">
            <div class="card-title">ইউএনও-র আপত্তিকর ভিডিও ভাইরাল ফুল প্যাকেজ</div>
            <div class="card-desc">মোট ৬ টা ভিডিও || সব ৯ মিনিট+ এর ভিডিও 😳</div>
            <button class="unlock-btn">🔓 Unlock / Watch Video 1</button>
        </div>
    </div>

    <!-- ভিডিও কার্ড ২ -->
    <div class="card" onclick="openTelegramLink('https://t.me/banglamal234/14')">
        <div style="position: relative;">
            <img src="https://images.unsplash.com/photo-1579546929518-9e396f3cc809" class="card-img" alt="Thumbnail">
            <div class="badge" style="background: #238636;">Hot</div>
        </div>
        <div class="card-body">
            <div class="card-title">বিকাশ হ্যাকিং ও নতুন ভাইরাল লিংক</div>
            <div class="card-desc">এক্সক্লুসিভ ভিডিও প্যাকেজ 🔥</div>
            <button class="unlock-btn">🔓 Unlock / Watch Video 2</button>
        </div>
    </div>

    <!-- ভিডিও কার্ড ৩ -->
    <div class="card" onclick="openTelegramLink('https://t.me/banglamal234/15')">
        <div style="position: relative;">
            <img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853" class="card-img" alt="Thumbnail">
            <div class="badge" style="background: #1f6feb;">VIP</div>
        </div>
        <div class="card-body">
            <div class="card-title">বিশেষ ভিডিও প্যাকেজ ৩</div>
            <div class="card-desc">ফুল এইচডি কোয়ালিটি ভিডিও ফাইল 📥</div>
            <button class="unlock-btn">🔓 Unlock / Watch Video 3</button>
        </div>
    </div>

    <script>
        // Telegram Web App init
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
        }

        function openTelegramLink(url) {
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
