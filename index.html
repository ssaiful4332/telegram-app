    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function showToast(text) {
            let x = document.getElementById("toast");
            x.innerText = text;
            x.className = "show";
            setTimeout(() => { x.className = x.className.replace("show", ""); }, 2300);
        }

        function toggleTheme() { document.body.classList.toggle('light-theme'); }
        function setThemeAccent(accent, btn) {
            document.documentElement.style.setProperty('--accent-color', accent);
            document.documentElement.style.setProperty('--btn-color', btn);
            showToast("থিম পরিবর্তন করা হয়েছে!");
        }
        function shareApp() {
            if(navigator.share) { navigator.share({ title: 'UNLIMITED VIDS', url: window.location.href }); }
            else { showToast("লিংক কপি করা হয়েছে!"); }
        }

        function openSettingsModal() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettingsModal() { document.getElementById('settingsModal').style.display = 'none'; }
        function openSpinModal() { document.getElementById('spinModal').style.display = 'flex'; }
        function closeSpinModal() { document.getElementById('spinModal').style.display = 'none'; }
        function openLeaderboardModal() { document.getElementById('leaderboardModal').style.display = 'flex'; }
        function closeLeaderboardModal() { document.getElementById('leaderboardModal').style.display = 'none'; }
        function openCommentModal() { document.getElementById('commentModal').style.display = 'flex'; }
        function closeCommentModal() { document.getElementById('commentModal').style.display = 'none'; }

        function openVideoLink(url) {
            if (url && url !== "" && url !== "#") {
                if (tg && tg.openLink) {
                    tg.openLink(url);
                } else {
                    window.open(url, '_blank');
                }
            } else {
                showToast("দুঃখিত, এই ভিডিওর কোনো লিংক দেওয়া নেই!");
            }
        }

        function checkAdminPassword() {
            let pass = prompt("গোপন অ্যাডমিন পাসওয়ার্ড দিন:");
            if (pass === "Lamiya" || pass === "admin" || pass === "1234") {
                closeSettingsModal();
                document.getElementById('adminModal').style.display = 'flex';
            } else if (pass !== null) {
                showToast("ভুল পাসওয়ার্ড!");
            }
        }
        function closeAdminModal() { document.getElementById('adminModal').style.display = 'none'; }

        function updateBanner() {
            let text = document.getElementById('adminBannerInput').value;
            if(text) {
                document.getElementById('bannerTextDisplay').innerText = text;
                showToast("ব্যানার আপডেট সফল হয়েছে!");
            }
        }

        function getSavedVideos() {
            let videos = localStorage.getItem('unlimited_vids_list');
            if (!videos) {
                let defaultVideos = [
                    {
                        id: 'v1',
                        img: 'https://picsum.photos/400/200?random=1',
                        videoUrl: 'https://t.me/example_video_link',
                        title: 'জামাই বউ | নতুন ভাইরাল ভিডিও ২০২৬ 🎬',
                        duration: '03:38',
                        views: '257 Views',
                        likes: 58
                    }
                ];
                localStorage.setItem('unlimited_vids_list', JSON.stringify(defaultVideos));
                return defaultVideos;
            }
            return JSON.parse(videos);
        }

        function renderCards() {
            let container = document.getElementById('card-container');
            container.innerHTML = '';
            let videos = getSavedVideos();

            videos.forEach(v => {
                let card = document.createElement('div');
                card.className = 'card';
                card.id = `card-${v.id}`;
                card.setAttribute('data-id', v.id);
                card.setAttribute('data-video-url', v.videoUrl);

                card.innerHTML = `
                    <div class="card-img-container">
                        <img src="${v.img}" class="card-img" alt="Video">
                        <span class="preview-badge">VIP PREVIEW</span>
                        <span class="duration-badge">${v.duration}</span>
                        <button class="fav-icon" onclick="toggleFavorite(this)">⭐</button>
                    </div>
                    <div class="card-body">
                        <div class="card-title">${v.title}</div>
                        <div class="card-footer-info">
                            <span>👁️ ${v.views}</span>
                            <button class="like-btn" onclick="toggleLike(this, '${v.id}')">👍 <span>${v.likes}</span></button>
                        </div>
                        <div class="card-actions-row">
                            <button class="comment-section-btn" onclick="openCommentModal()">💬 কমেন্ট</button>
                            <button class="share-link-btn" onclick="copyVideoLink('${v.id}')">🔗 লিংক কপি</button>
                        </div>
                        <button class="unlock-btn" onclick="openVideoLink('${v.videoUrl}')">▶ WATCH / DOWNLOAD NOW</button>
                        
                        <div class="card-unique-link-box">
                            <span>🔗 Unique Link: ...?startapp=${v.id}</span>
                            <button onclick="copyVideoLink('${v.id}')">Copy</button>
                        </div>
                        <button class="admin-delete-card-btn" onclick="deleteVideoCard('${v.id}')">🗑️ ডিলিট কার্ড</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        let lastCreatedLink = "";

        function createNewCardWithAutoLink() {
            let img = document.getElementById('cardImgInput').value || "https://picsum.photos/400/200?random=" + Math.floor(Math.random()*100);
            let videoUrl = document.getElementById('cardVideoUrlInput').value.trim();
            let title = document.getElementById('cardTitleInput').value || "নতুন ভাইরাল ভিডিও";
            let duration = document.getElementById('cardDurationInput').value || "04:30";
            
            if(!videoUrl) {
                showToast("দয়া করে ভিডিওর লিংক দিন!");
                return;
            }

            let uniqueId = "v_" + Math.random().toString(36).substring(2, 7);
            let currentBaseUrl = window.location.href.split('?')[0];
            lastCreatedLink = `${currentBaseUrl}?startapp=${uniqueId}`;

            let newVideo = {
                id: uniqueId,
                img: img,
                videoUrl: videoUrl,
                title: title,
                duration: duration,
                views: '15 Views',
                likes: 0
            };

            let videos = getSavedVideos();
            videos.unshift(newVideo);
            localStorage.setItem('unlimited_vids_list', JSON.stringify(videos));

            renderCards();

            document.getElementById('lastGeneratedBox').style.display = 'block';
            document.getElementById('latestUniqueLinkText').innerText = lastCreatedLink;
            
            showToast("ভিডিও পার্মানেন্টলি পোস্ট হয়েছে ও ইউনিক লিংক তৈরি হয়েছে!");
            
            document.getElementById('cardImgInput').value = '';
            document.getElementById('cardVideoUrlInput').value = '';
            document.getElementById('cardTitleInput').value = '';
            document.getElementById('cardDurationInput').value = '';
        }

        function deleteVideoCard(id) {
            let pass = prompt("ভিডিওটি ডিলিট করতে অ্যাডমিন পাসওয়ার্ড দিন:");
            if (pass === "Lamiya" || pass === "admin" || pass === "1234") {
                let videos = getSavedVideos();
                videos = videos.filter(v => v.id !== id);
                localStorage.setItem('unlimited_vids_list', JSON.stringify(videos));
                renderCards();
                showToast("কার্ড সফলভাবে ডিলিট করা হয়েছে!");
            } else if (pass !== null) {
                showToast("ভুল পাসওয়ার্ড!");
            }
        }

        function copyLatestGeneratedLink() {
            if(lastCreatedLink) {
                navigator.clipboard.writeText(lastCreatedLink).then(() => {
                    showToast("লিংক কপি করা হয়েছে! 🔗");
                });
            }
        }

        function copyVideoLink(uid) {
            let currentBaseUrl = window.location.href.split('?')[0];
            let videoLink = `${currentBaseUrl}?startapp=${uid}`;
            navigator.clipboard.writeText(videoLink).then(() => {
                showToast("ভিডিওর ইউনিক লিংক কপি করা হয়েছে! 🔗");
            });
        }

        // ফিক্সড লোড ফাংশন যা সরাসরি ডেটা থেকে আইডি ম্যাচ করে পপআপ দেখাবে
        window.addEventListener('load', () => {
            renderCards();

            const urlParams = new URLSearchParams(window.location.search);
            let startAppParam = urlParams.get('startapp');
            
            if (!startAppParam && tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
                startAppParam = tg.initDataUnsafe.start_param;
            }

            if (startAppParam) {
                setTimeout(() => {
                    let videos = getSavedVideos();
                    let targetVideo = videos.find(v => v.id === startAppParam);

                    if (targetVideo) {
                        let focusContainer = document.getElementById('focusCardContainer');
                        focusContainer.innerHTML = `
                            <div class="card" style="margin:0; border:none; box-shadow:none;">
                                <div class="card-img-container">
                                    <img src="${targetVideo.img}" class="card-img" alt="Video">
                                    <span class="preview-badge">VIP PREVIEW</span>
                                    <span class="duration-badge">${targetVideo.duration}</span>
                                    <button class="fav-icon" onclick="toggleFavorite(this)">⭐</button>
                                </div>
                                <div class="card-body" style="padding:0;">
                                    <div class="card-title">${targetVideo.title}</div>
                                    <div class="card-footer-info">
                                        <span>👁️ ${targetVideo.views}</span>
                                        <button class="like-btn" onclick="toggleLike(this, '${targetVideo.id}')">👍 <span>${targetVideo.likes}</span></button>
                                    </div>
                                    <button class="unlock-btn" onclick="openVideoLink('${targetVideo.videoUrl}')">▶ WATCH / DOWNLOAD NOW</button>
                                </div>
                            </div>
                        `;
                        document.getElementById('singleVideoFocusModal').style.display = 'flex';
                    }
                }, 150);
            }
        });

        function closeFocusModal() {
            document.getElementById('singleVideoFocusModal').style.display = 'none';
        }

        function toggleFavorite(btn) { btn.classList.toggle('active'); }
        function toggleLike(btn, id) {
            btn.classList.toggle('liked');
            let span = btn.querySelector('span');
            let count = parseInt(span.innerText);
            if(btn.classList.contains('liked')) span.innerText = count + 1;
            else span.innerText = count - 1;
        }

        function filterCategory(cat, el) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function filterContent() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.querySelectorAll('#card-container .card');
            let hasVisible = false;
            cards.forEach(card => {
                let title = card.querySelector('.card-title').innerText.toLowerCase();
                if(title.includes(query)) {
                    card.style.display = 'block';
                    hasVisible = true;
                } else {
                    card.style.display = 'none';
                }
            });
            document.getElementById('no-result').style.display = hasVisible ? 'none' : 'block';
        }

        function postComment() {
            let box = document.getElementById('commentInputBox');
            if(!box.value.trim()) return;
            let list = document.getElementById('commentList');
            let div = document.createElement('div');
            div.className = 'comment-item';
            div.innerHTML = `<b>আপনি:</b> ${box.value}`;
            list.appendChild(div);
            box.value = '';
        }

        function executeSpin() {
            document.getElementById('spinBox').innerText = "🎉 ৫০ কয়েন পেলেন!";
            showToast("স্পিন সফল হয়েছে!");
        }
    </script>
