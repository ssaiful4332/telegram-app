<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNLIMITED VIDS - Stable Version</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1a1a24;
            --text-color: #ffffff;
            --accent-color: #8a2be2;
            --btn-color: #7b1fa2;
            --border-color: #2e2e3e;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }
        .header h2 {
            margin: 0;
            font-size: 18px;
            color: #d1c4e9;
        }
        .admin-btn {
            background: #e91e63;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .card-img-container {
            position: relative;
            width: 100%;
            height: 180px;
        }
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-body {
            padding: 12px;
        }
        .card-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .watch-btn {
            width: 100%;
            background: linear-gradient(135deg, #7b1fa2, #ba68c8);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 330px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .close-modal {
            float: right;
            font-size: 18px;
            cursor: pointer;
            color: #aaa;
        }
        .admin-input {
            width: 100%;
            padding: 8px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        #toast {
            visibility: hidden;
            min-width: 200px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 6px;
            padding: 10px;
            position: fixed;
            z-index: 200;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 12px;
        }
        #toast.show { visibility: visible; }
    </style>
</head>
<body>

    <div class="header">
        <h2>UNLIMITED VIDS</h2>
        <button class="admin-btn" onclick="openAdmin()">⚙️ Admin</button>
    </div>

    <div id="card-container">
        <p style="text-align: center; color: #888;">লোড হচ্ছে...</p>
    </div>

    <div id="toast">নোটিফিকেশন</div>

    <!-- অ্যাডমিন প্যানেল মডাল -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeAdmin()">&times;</span>
            <h3 style="color: #e91e63; margin-top: 5px; font-size: 16px;">🔐 Admin Panel</h3>
            <input type="text" id="vidTitle" class="admin-input" placeholder="ভিডিও টাইটেল">
            <input type="text" id="vidImage" class="admin-input" placeholder="থাম্বনেইল ইমেজ URL">
            <input type="text" id="vidLink" class="admin-input" placeholder="ভিডিও লিঙ্ক">
            <button onclick="addVideo()" style="width: 100%; background: #e91e63; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer;">ভিডিও যোগ করুন</button>
        </div>
    </div>

    <script>
        // ফায়ারবেস কনফিগ
        const firebaseConfig = {
            databaseURL: "https://saifulappbot-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let tg = window.Telegram.WebApp;
        tg.expand();

        function showToast(text) {
            let t = document.getElementById("toast");
            t.innerText = text;
            t.className = "show";
            setTimeout(() => { t.className = ""; }, 2000);
        }

        // ফায়ারবেস থেকে ভিডিও লোড করা
        db.ref('videos').on('value', snapshot => {
            let container = document.getElementById('card-container');
            container.innerHTML = '';
            let data = snapshot.val();
            
            if(!data) {
                container.innerHTML = '<p style="text-align: center; color: #888;">কোনো ভিডিও পাওয়া যায়নি!</p>';
                return;
            }

            Object.keys(data).forEach(key => {
                let v = data[key];
                let html = `
                    <div class="card">
                        <div class="card-img-container">
                            <img class="card-img" src="${v.image}" alt="thumb">
                        </div>
                        <div class="card-body">
                            <div class="card-title">${v.title}</div>
                            <button class="watch-btn" onclick="window.open('${v.link}', '_blank')">▶ WATCH NOW</button>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        });

        function openAdmin() {
            let pass = prompt("অ্যাডমিন পাসওয়ার্ড দিন:");
            if(pass === "Lamiya" || pass === "admin") {
                document.getElementById('adminModal').style.display = 'flex';
            } else if(pass !== null) {
                showToast("ভুল পাসওয়ার্ড!");
            }
        }

        function closeAdmin() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function addVideo() {
            let title = document.getElementById('vidTitle').value.trim();
            let image = document.getElementById('vidImage').value.trim();
            let link = document.getElementById('vidLink').value.trim();

            if(title && image && link) {
                db.ref('videos').push({ title, image, link }).then(() => {
                    showToast("সফলভাবে ভিডিও যোগ হয়েছে!");
                    document.getElementById('vidTitle').value = '';
                    document.getElementById('vidImage').value = '';
                    document.getElementById('vidLink').value = '';
                    closeAdmin();
                }).catch(err => {
                    showToast("সমস্যা হয়েছে!");
                    console.error(err);
                });
            } else {
                showToast("সবগুলো ঘর পূরণ করুন!");
            }
        }
    </script>
</body>
</html>
