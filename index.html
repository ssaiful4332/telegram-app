<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App - Video Unlocker</title>
    <!-- টেলিগ্রাম ওয়েব অ্যাপ এসডিকে -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .card {
            background: #1e293b;
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card-content {
            padding: 15px;
        }
        .title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .stats {
            display: flex;
            gap: 15px;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 15px;
        }
        .task-box {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }
        .progress-text {
            font-size: 14px;
            margin-bottom: 8px;
            color: #cbd5e1;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: #ffffff;
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        .btn-success {
            background: #22c55e;
            color: #ffffff;
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- ভিডিওর থাম্বনেইল বা ব্যানার -->
        <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=500&auto=format&fit=crop" alt="Video Thumbnail">
        
        <div class="card-content">
            <div class="title">🔥 নতুন ভাইরাল কলেজ ছাত্রী ও তার বয়ফ্রেন্ডের ভিডিও! ক্লাস রুমে রোমান্সের ভিডিও দেখতে নিচে ক্লিক করুন।</div>
            
            <div class="stats">
                <span>❤️️ 14 Likes</span>
                <span>👁️ 1077 Views</span>
                <span>🎬 3 clips</span>
            </div>

            <!-- টাস্ক ও প্রোগ্রেস সেকশন -->
            <div class="task-box">
                <div class="progress-text" id="statusText">▶️ Watch 3 ads to unlock</div>
                <button class="btn btn-primary" id="watchAdBtn" onclick="simulateAdWatch()">UNLOCK VIDEO</button>
            </div>

            <!-- আনলক হওয়ার পর ফাইনাল লিংক বা বাটন -->
            <a href="https://t.me/your_channel_link" target="_blank" class="btn btn-success" id="downloadBtn">🔓 OPEN FULL VIDEO</a>
        </div>
    </div>

    <script>
        // টেলিগ্রাম ওয়েব অ্যাপ ইনিশিয়ালাইজ করা
        let tg = window.Telegram.WebApp;
        tg.expand();

        let adsWatched = 0;
        const totalAds = 3;

        function simulateAdWatch() {
            // এখানে আপনি এড নেটওয়ার্কের (যেমন Adsterra) কোড বসাতে পারেন
            adsWatched++;

            if (adsWatched < totalAds) {
                document.getElementById('statusText').innerText = `⏳ Progress: ${adsWatched}/${totalAds} (अगले विज्ञापन देखें)`;
                alert(`বিজ্ঞাপন দেখা সম্পন্ন হয়েছে (${adsWatched}/${totalAds})। পরবর্তী ধাপ সম্পন্ন করুন।`);
            } else {
                // সব অ্যাড দেখা শেষ হলে আনলক হয়ে যাবে
                document.getElementById('statusText').innerText = "✅ Video Unlocked Successfully!";
                document.getElementById('watchAdBtn').style.display = 'none';
                document.getElementById('downloadBtn').style.display = 'inline-block';
            }
        }
    </script>
</body>
</html>
