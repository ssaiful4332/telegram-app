<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNLIMITED VIDS</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0713;
            --card-bg: #151022;
            --text-color: #ffffff;
            --accent-color: #9c27b0;
            --btn-color: #7b1fa2;
            --border-color: #2a2040;
        }
        body.light-theme {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
            --accent-color: #7b1fa2;
        }
        body {
            font-family: Arial, sans-serif, 'SolaimanLipi';
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 8px;
            transition: 0.3s;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .header h2 {
            margin: 0;
            font-size: 18px;
            letter-spacing: 1px;
            color: var(--accent-color);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .action-btn {
            background: var(--border-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
        }
        /* অ্যানাউন্সমেন্ট ব্যানার */
        .announcement-banner {
            background: linear-gradient(135deg, #7b1fa2, #e91e63);
            color: white;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }
        /* কয়েন ব্যালেন্স বার */
        .coin-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .coin-bar button {
            background: #ff9800;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .search-box {
            margin-bottom: 12px;
        }
        .search-input {
            width: 100%;
            padding: 10px 15px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            white-space: nowrap;
            margin-bottom: 12px;
        }
        .categories::-webkit-scrollbar {
            display: none;
        }
        .cat-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }
        .cat-btn.active, .cat-btn:hover {
            background: var(--btn-color);
            color: white;
            border-color: var(--btn-color);
        }
        .card {
            background: var(--card-bg);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .card-img-container {
            position: relative;
            width: 100%;
            height: 190px;
            overflow: hidden;
        }
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .duration-badge {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 3px 8px;
            font-size: 12px;
            border-radius: 6px;
            font-weight: bold;
        }
        .fav-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: white;
            font-size: 16px;
            padding: 6px;
            border-radius: 50%;
            cursor: pointer;
        }
        .fav-icon.active {
            color: #ff4444;
        }
        .card-body {
            padding: 12px;
        }
        .card-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .card-footer-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #b0bec5;
            margin-bottom: 10px;
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
        }
        .like-btn {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .like-btn.liked {
            color: #ff4444;
            font-weight: bold;
        }
        .comment-section-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
        }
        .unlock-btn {
            width: 100%;
            background: linear-gradient(135deg, #7b1fa2, #9c27b0);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        #no-result {
            text-align: center;
            color: #8b949e;
            padding: 20px;
            display: none;
        }

        /* টোস্ট নোটিফিকেশন */
        #toast {
            visibility: hidden;
            min-width: 200px;
            background-color: #151022;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 10px;
            position: fixed;
            z-index: 200;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 13px;
            border: 1px solid var(--border-color);
        }
        #toast.show {
            visibility: visible;
            animation: fadein 0.3s, fadeout 0.3s 2s;
        }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        /* মডাল স্টাইল */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 14px;
            width: 85%;
            max-width: 330px;
            text-align: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            max-height: 80vh;
            overflow-y: auto;
        }
        .close-modal {
            float: right;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            color: #8b949e;
        }
        .close-modal:hover { color: #fff; }

        /* কমেন্ট বক্স ও লিস্ট স্টাইল */
        .comment-input {
            width: 100%;
            padding: 8px;
            background: var(--border-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 8px;
            box-sizing: border-box;
            outline: none;
        }
        .comment-list {
            text-align: left;
            max-height: 120px;
            overflow-y: auto;
            font-size: 12px;
            margin-bottom: 10px;
            border-top: 1px solid var(--border-color);
            padding-top: 5px;
        }
        .comment-item {
            background: var(--border-color);
            padding: 5px 8px;
            border-radius: 5px;
            margin-bottom: 5px;
        }

        /* সেটিংস অপশন লিস্ট স্টাইল */
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 13px;
            text-align: left;
        }
        .setting-item button {
            background: var(--btn-color);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
