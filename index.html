    <style>
        :root {
            --bg-color: #0b0713;
            --card-bg: #151022;
            --text-color: #ffffff;
            --accent-color: #9c27b0;
            --btn-color: #7b1fa2;
            --border-color: #2a2040;
        }
        body {
            font-family: Arial, sans-serif, 'SolaimanLipi';
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 8px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .header h2 {
            margin: 0;
            font-size: 18px;
            letter-spacing: 1px;
            color: #d1c4e9;
        }
        .search-box {
            margin-bottom: 12px;
        }
        .search-input {
            width: 100%;
            padding: 10px 15px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .search-input:focus {
            border-color: var(--accent-color);
        }
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            white-space: nowrap;
            margin-bottom: 12px;
        }
        .categories::-webkit-scrollbar {
            display: none;
        }
        .cat-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
        }
        .cat-btn.active, .cat-btn:hover {
            background: var(--btn-color);
            border-color: var(--btn-color);
        }
        .card {
            background: var(--card-bg);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .card-img-container {
            position: relative;
            width: 100%;
            height: 190px;
            overflow: hidden;
        }
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .duration-badge {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 3px 8px;
            font-size: 12px;
            border-radius: 6px;
            font-weight: bold;
        }
        .card-body {
            padding: 12px;
        }
        .card-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .card-footer-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #b0bec5;
            margin-bottom: 12px;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }
