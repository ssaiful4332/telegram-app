<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlimited Vids</title>
    <!-- টেলিগ্রাম ওয়েব অ্যাপ এসডিকে -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Firebase SDK for Realtime Database -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, remove, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbVizR7Lq1Y71w3tOjwzMxI0R8g8sBCK4",
            authDomain: "unlimited-vids-8d309.firebaseapp.com",
            databaseURL: "https://unlimited-vids-8d309-default-rtdb.firebaseio.com",
            projectId: "unlimited-vids-8d309",
            storageBucket: "unlimited-vids-8d309.firebasestorage.app",
            messagingSenderId: "866862984118",
            appId: "1:866862984118:web:caf3d61c60fdd487ef6f17",
            measurementId: "G-YKNY6RPTYN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let tg = window.Telegram.WebApp;
        tg.expand();
        if(tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('tgUser').innerText = "@" + (tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name);
        }

        const videoListContainer = document.getElementById('videoListContainer');
        const adminVideoList = document.getElementById('adminVideoList');
        const searchInput = document.getElementById('searchInput');

        let allVideosData = {};
        let currentCategory = 'All';

        // রিয়েলটাইম ডাটাবেস থেকে ভিডিও লোড করা
        const videosRef = ref(db, 'videos');
        onValue(videosRef, (snapshot) => {
            const data = snapshot.val();
            allVideosData = data || {};
            renderVideos();
            renderAdminList();
        });

        // ভিডিও রেন্ডার ও ফিল্টার করার ফাংশন
        window.renderVideos = function() {
            videoListContainer.innerHTML = '';
            const searchQuery = searchInput.value.toLowerCase();
            
            let filteredKeys = Object.keys(allVideosData).filter(id => {
                let video = allVideosData[id];
                let matchesSearch = video.title.toLowerCase().includes(searchQuery);
                let matchesCategory = currentCategory === 'All' || video.category === currentCategory;
                return matchesSearch && matchesCategory;
            });

            if (filteredKeys.length === 0) {
                videoListContainer.innerHTML = '<div class="no-video">কোনো ভিডিও পাওয়া যায়নি।</div>';
                return;
            }

            filteredKeys.forEach((id) => {
                let video = allVideosData[id];
                let likes = video.likes || 0;
                let views = video.views || 1200;

                videoListContainer.innerHTML += `
                    <div class="video-card">
                        <div class="thumbnail-container">
                            <span class="preview-badge">${video.category || 'General'}</span>
                            <img src="${video.thumb}" alt="Thumbnail">
                        </div>
                        <div class="video-info">
                            <div class="video-title">${video.title}</div>
                            <div class="video-meta">
                                <span>👁️ ${views} Views</span>
                                <button class="like-btn-action" onclick="handleLike('${id}')">❤️ <span id="like-count-${id}">${likes}</span></button>
                            </div>
                            <a href="${video.link}" target="_blank" onclick="incrementView('${id}')">
                                <button class="unlock-btn">🔒 UNLOCK FULL VIDEO</button>
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        // ক্যাটাগরি পরিবর্তনের ফাংশন
        window.filterCategory = function(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active-cat'));
            btn.classList.add('active-cat');
            renderVideos();
        }

        // লাইক বাড়ানোর ফাংশন
        window.handleLike = function(id) {
            let videoRef = ref(db, 'videos/' + id);
            let currentLikes = (allVideosData[id].likes || 0) + 1;
            update(videoRef, { likes: currentLikes });
        }

        // ভিউ বাড়ানোর ফাংশন
        window.incrementView = function(id) {
            let videoRef = ref(db, 'videos/' + id);
            let currentViews = (allVideosData[id].views || 1200) + 1;
            update(videoRef, { views: currentViews });
        }

        // অ্যাডমিন লিস্ট রেন্ডার করা
        function renderAdminList() {
            adminVideoList.innerHTML = '';
            let keys = Object.keys(allVideosData);
            if(keys.length === 0) {
                adminVideoList.innerHTML = '<div style="color:#64748b; font-size:12px;">কোনো ভিডিও নেই</div>';
                return;
            }
            keys.forEach((id) => {
                let video = allVideosData[id];
                adminVideoList.innerHTML += `
                    <div class="admin-item">
                        <span>${video.title.substring(0, 20)}...</span>
                        <button class="delete-btn" onclick="deleteVideo('${id}')">ডিলিট</button>
                    </div>
                `;
            });
        }

        // নতুন ভিডিও যোগ করা
        window.addNewVideo = function() {
            const title = document.getElementById('vidTitle').value;
            const thumb = document.getElementById('vidThumb').value;
            const link = document.getElementById('vidLink').value;
            const category = document.getElementById('vidCategory').value;

            if(!title || !thumb || !link) {
                alert('দয়া করে সবগুলো ঘর পূরণ করুন!');
                return;
            }

            push(videosRef, {
                title: title,
                thumb: thumb,
                link: link,
                category: category,
                likes: 0,
                views: 1200,
                createdAt: Date.now()
            }).then(() => {
                document.getElementById('vidTitle').value = '';
                document.getElementById('vidThumb').value = '';
                document.getElementById('vidLink').value = '';
                alert('ভিডিও সফলভাবে যুক্ত করা হয়েছে!');
            }).catch((error) => {
                alert('ভিডিও যোগ করতে সমস্যা হয়েছে: ' + error.message);
            });
        }

        // ভিডিও ডিলিট করা
        window.deleteVideo = function(id) {
            if(confirm('আপনি কি এই ভিডিওটি ডিলিট করতে চান?')) {
                remove(ref(db, 'videos/' + id));
            }
        }
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; padding: 10px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 450px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .app-title { font-size: 18px; font-weight: bold; }
        .icon-btn { background: #1e293b; border: none; color: #fff; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }
        
        /* সার্চ বার ও ক্যাটাগরি স্টাইল */
        .search-box { width: 100%; padding: 10px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #fff; margin-bottom: 12px; font-size: 14px; outline: none; }
        .categories-container { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 15px; padding-bottom: 5px; }
        .categories-container::-webkit-scrollbar { display: none; }
        .cat-tab { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; white-space: nowrap; transition: 0.3s; }
        .cat-tab.active-cat { background: #7c3aed; color: #fff; border-color: #7c3aed; font-weight: bold; }

        .stats-box { background: #1e293b; border-radius: 12px; padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; text-align: center; }
        .stat-item { background: #0f172a; padding: 10px; border-radius: 8px; }
        .stat-item span { display: block; font-size: 12px; color: #94a3b8; }
        .stat-item b { font-size: 16px; color: #fbbf24; }
        
        .video-card { background: #1e293b; border-radius: 12px; overflow: hidden; margin-bottom: 15px; border: 1px solid #334155; }
        .thumbnail-container { position: relative; width: 100%; height: 180px; }
        .thumbnail-container img { width: 100%; height: 100%; object-fit: cover; }
        .preview-badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #fbbf24; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .video-info { padding: 12px; }
        .video-title { font-size: 14px; margin-bottom: 8px; line-height: 1.4; }
        .video-meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #94a3b8; margin-bottom: 10px; }
        .like-btn-action { background: #0f172a; border: 1px solid #334155; color: #f43f5e; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .unlock-btn { width: 100%; background: linear-gradient(135deg, #7c3aed, #db2777); color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
        .modal-content { background: #1e293b; width: 100%; max-width: 400px; border-radius: 12px; padding: 20px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .close-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
        input, select, button.action-btn { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: none; }
        input, select { background: #0f172a; color: #fff; border: 1px solid #334155; outline: none; }
        button.action-btn { background: #db2777; color: #fff; font-weight: bold; cursor: pointer; }
        .admin-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; }
        .delete-btn { background: #ef4444; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .no-video { text-align: center; color: #64748b; padding: 30px; font-size: 14px; }
        .bot-link-box { text-align: center; margin-bottom: 15px; font-size: 13px; color: #94a3b8; }
        .bot-link-box a { color: #38bdf8; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="app-title">Unlimited Vids</div>
            <div class="header-btns">
                <button class="icon-btn" onclick="openSettings()">⚙️ Settings</button>
            </div>
        </div>

        <div class="bot-link-box">
            সরাসরি বটে যুক্ত হতে: <a href="https://t.me/saifulappbot" target="_blank">@saifulappbot</a>
        </div>

        <div class="stats-box">
            <div class="stat-item">
                <span>কয়েন</span>
                <b>50</b>
            </div>
            <div class="stat-item">
                <span>ইউজার র‍্যাংক</span>
                <b>Bronze</b>
            </div>
        </div>

        <!-- সার্চ বার -->
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 ভিডিও সার্চ করুন..." onkeyup="renderVideos()">

        <!-- ক্যাটাগরি ট্যাব -->
        <div class="categories-container">
            <button class="cat-tab active-cat" onclick="filterCategory('All', this)">All</button>
            <button class="cat-tab" onclick="filterCategory('Trending', this)">Trending</button>
            <button class="cat-tab" onclick="filterCategory('Latest', this)">Latest</button>
            <button class="cat-tab" onclick="filterCategory('Exclusive', this)">Exclusive</button>
        </div>

        <!-- ভিডিও লিস্ট কনটেইনার -->
        <div id="videoListContainer">
            <div class="no-video">লোড হচ্ছে...</div>
        </div>
    </div>

    <!-- সেটিংস ও অ্যাডমিন প্যানেল মডাল -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Admin & Settings</h3>
                <button class="close-btn" onclick="closeSettings()">✕</button>
            </div>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 10px;">Telegram User: <b id="tgUser">@User</b></p>
            
            <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">

            <h4>🛠️ Admin Panel</h4>
            <div style="margin-top: 10px;">
                <input type="text" id="vidTitle" placeholder="ভিডিও টাইটেল...">
                <input type="text" id="vidThumb" placeholder="থাম্বনেইল ইমেজ URL...">
                <input type="text" id="vidLink" placeholder="আনলক লিংক (Telegram/Web)...">
                <select id="vidCategory">
                    <option value="Trending">Trending</option>
                    <option value="Latest">Latest</option>
                    <option value="Exclusive">Exclusive</option>
                </select>
                <button class="action-btn" onclick="addNewVideo()">নতুন ভিডিও যোগ করুন</button>
            </div>

            <div style="margin-top: 15px;">
                <h5>যুক্ত করা ভিডিওসমূহ:</h5>
                <div id="adminVideoList" style="margin-top: 8px;"></div>
            </div>
        </div>
    </div>

    <script>
        function openSettings() {
            let pass = prompt('অ্যাডমিন পাসওয়ার্ড দিন:');
            if(pass === 'Lamiya') {
                document.getElementById('settingsModal').style.display = 'flex';
            } else if(pass !== null) {
                alert('ভুল পাসওয়ার্ড!');
            }
        }
        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }
    </script>
</body>
</html>
